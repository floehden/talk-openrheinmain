---
version: "1.0"
namespaces:
  - name: Topology
    description: Core Network Topology Models

nodes:
  - name: Platform
    namespace: Topology
    description: The operating system running on the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Role
    namespace: Topology
    description: The functional role of the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Device
    namespace: Topology
    description: A network router or switch
    attributes:
      - name: name
        kind: Text
        unique: true
    relationships:
      - name: platform
        peer: TopologyPlatform
        cardinality: one
      - name: role
        peer: TopologyRole
        cardinality: one

  - name: Interface
    namespace: Topology
    description: A physical port on the device
    attributes:
      - name: name
        kind: Text
    relationships:
      - name: device
        peer: TopologyDevice
        cardinality: one
      - name: connected_endpoint
        peer: TopologyInterface
        cardinality: one
        optional: true
    uniqueness_constraints:
      - [device, name]