---
version: "1.0"

nodes:
  - name: Platform
    namespace: Topology
    description: The operating system running on the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Role
    namespace: Topology
    description: The functional role of the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Device
    namespace: Topology
    description: A network router or switch
    attributes:
      - name: name
        kind: Text
        unique: true
    relationships:
      - name: platform
        peer: TopologyPlatform
        cardinality: one
        kind: Attribute
      - name: role
        peer: TopologyRole
        cardinality: one
        kind: Attribute

  - name: Interface
    namespace: Topology
    description: A physical port on the device
    attributes:
      - name: name
        kind: Text
    relationships:
      - name: device
        peer: TopologyDevice
        cardinality: one
        optional: false
        kind: Attribute
      - name: connected_endpoint
        peer: TopologyInterface
        cardinality: one
        optional: true
        kind: Attribute
        direction: outbound
    uniqueness_constraints:
      - ["device", "name__value"]
