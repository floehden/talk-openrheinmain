name: sync-targets-from-infrahub

# Triggered two ways:
#  - repository_dispatch: fired by the Infrahub webhook (event type: infrahub-sync)
#  - workflow_dispatch:   manual "Run" button for testing
on:
  repository_dispatch:
    types: [infrahub-sync]
  workflow_dispatch: {}

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    env:
      # In-cluster address of Infrahub (the runner is a pod in the cluster).
      INFRAHUB_ADDRESS: "http://infrahub-infrahub-server.infrahub.svc.cluster.local:8000"
      # Token injected as a Gitea Actions secret (see setup notes).
      INFRAHUB_API_TOKEN: ${{ secrets.INFRAHUB_API_TOKEN }}
      # Host IP the gNMIc container dials to reach the SR Linux nodes.
      TARGET_HOST_IP: "192.168.139.126"
      # Gitea creds to push into the Flux repo.
      GITEA_USER: "admin"
      GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
      FLUX_REPO: "network-observability-config"
      GITEA_HTTP: "http://gitea-http.gitea.svc.cluster.local:3000"

    steps:
      - name: Checkout this repo (infrahub-sync, holds the render script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "infrahub-sdk<2"

      - name: Clone the Flux repo
        run: |
          git clone "http://${GITEA_USER}:${GITEA_PASSWORD}@gitea-http.gitea.svc.cluster.local:3000/admin/${FLUX_REPO}.git" fluxrepo

      - name: Render targets from Infrahub into the Flux repo
        env:
          OUTPUT_FILE: "fluxrepo/02-targets.yaml"
        run: |
          python render_targets.py

      - name: Commit and push if changed
        run: |
          cd fluxrepo
          git config user.email "infrahub-bot@lab.local"
          git config user.name "Infrahub Sync Bot"
          if git diff --quiet -- 02-targets.yaml; then
            echo "No changes in targets — nothing to commit."
            exit 0
          fi
          git add 02-targets.yaml
          git commit -m "chore(targets): sync from Infrahub [skip ci]"
          git push
          echo "Pushed updated targets to ${FLUX_REPO}."